<!DOCTYPE html>
<html lang="ua">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="admin_panel.css">
    <title>admin panel - чайна імперія</title>
    <link rel="shortcut icon" type="image/png" href="image/logo2.png">
</head>
<body>

    <!-- <div class="main_linies">
        <img src="image/logo.png" alt="" class="logo">
        <span class="all_cost" id="all_cost">Загальна сума:0</span>
    </div> -->

    <div class="main-box-invis" id="main-box"></div>

    <div class="box" id="box">
        <span class="text">Увійдіть в сестему</span>
        <input type="text" class="login" placeholder="Введіть логін">
        <input type="password" class="kod" placeholder="Введіть пароль">
        <button class="reg">Ввійти</button>
    </div>

    <!-- <div class="stina" id="stina"></div> -->

    <div class="change-invis" id="change">
        <span class="text">Ведіть нові дані</span>
        <input type="text" class="change-product" id="new_name" placeholder="Введіть нову назву">
        <input type="text" class="change-product" id="new_image" placeholder="Введіть нове зображення">
        <input type="text" class="change-product" id="new_price" placeholder="Введіть нову ціну">
        <button class="sumbit-new-change">Зберегти нові дані</button>
    </div>

    <script src="admin_panel.js"></script>
    
</body>
</html>
